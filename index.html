<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Octo</title>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <aside id="settings" class="sidebar" aria-hidden="true">
      <header class="sidebar-head">
        <span class="sidebar-title">Ayarlar</span>
        <button id="settings-close" class="sidebar-close" type="button" aria-label="Kapat">
          &times;
        </button>
      </header>

      <nav class="sidebar-nav" id="settings-nav">
        <button class="nav-item active" type="button" data-section="general">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <circle cx="8" cy="8" r="2.6" />
            <path d="M8 1.4v2M8 12.6v2M1.4 8h2M12.6 8h2M3.3 3.3l1.4 1.4M11.3 11.3l1.4 1.4M12.7 3.3l-1.4 1.4M4.7 11.3l-1.4 1.4" />
          </svg>
          General
        </button>
        <button class="nav-item" type="button" data-section="features">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M8 1.6l1.7 3.9 4.2 1.1-3 3 .7 4.3L8 12l-3.6 1.9.7-4.3-3-3 4.2-1.1z" />
          </svg>
          Features
        </button>
        <button class="nav-item" type="button" data-section="api">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <circle cx="5.4" cy="8" r="3" />
            <path d="M8.2 8h6M12 8v2.6M14 8v1.8" />
          </svg>
          API
        </button>
        <button class="nav-item" type="button" data-section="appearance">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <circle cx="8" cy="8" r="6.2" />
            <path d="M8 1.8a6.2 6.2 0 010 12.4z" class="fill" />
          </svg>
          Appearance
        </button>
      </nav>

      <div class="sidebar-body" id="settings-body" data-section="general"></div>

      <footer class="sidebar-foot">
        <button class="foot-btn" id="link-instagram" type="button" aria-label="Instagram" title="Coming Soon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3.2" y="3.2" width="17.6" height="17.6" rx="5.2" />
            <circle cx="12" cy="12" r="4.2" />
            <circle cx="17.1" cy="6.9" r="1.1" class="fill" />
          </svg>
        </button>
        <button class="foot-btn" id="link-github" type="button" aria-label="GitHub">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              class="fill"
              d="M12 .3a12 12 0 00-3.8 23.4c.6.1.8-.3.8-.6v-2c-3.3.7-4-.6-4-.6-.6-1.4-1.3-1.7-1.3-1.7-1.1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1.1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.8-1.6-2.7-.3-5.5-1.3-5.5-5.9 0-1.3.5-2.4 1.2-3.2-.1-.3-.5-1.5.1-3.2 0 0 1-.3 3.3 1.2a11.5 11.5 0 016 0C17.3 4.7 18.3 5 18.3 5c.6 1.7.2 2.9.1 3.2.8.8 1.2 1.9 1.2 3.2 0 4.6-2.8 5.6-5.5 5.9.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A12 12 0 0012 .3"
            />
          </svg>
        </button>
        <button class="foot-btn" id="link-web" type="button" aria-label="Web sitesi" title="Coming Soon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="8.8" />
            <path d="M3.4 12h17.2M12 3.2c2.6 2.9 2.6 14.7 0 17.6M12 3.2c-2.6 2.9-2.6 14.7 0 17.6" />
          </svg>
        </button>
      </footer>
    </aside>

    <aside id="dock" class="dock" aria-label="Octo ile sohbet">
      <div class="dock-grip" id="dock-grip" title="Sürükleyerek boyutlandır"></div>

      <header class="dock-head">
        <span class="dock-title">Octo</span>
        <span class="dock-status" id="dock-status">bağlanıyor…</span>
      </header>

      <div class="dock-log" id="dock-log" role="log" aria-live="polite"></div>

      <form class="composer" id="composer" autocomplete="off">
        <textarea
          id="composer-text"
          class="composer-text"
          rows="1"
          placeholder="Octo'ya bir şey yaz…"
        ></textarea>
        <div class="composer-bar">
          <button type="button" class="tool" id="tool-clear" title="Sohbeti temizle" aria-label="Sohbeti temizle">
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.6 8h5.8l.6-8" />
            </svg>
          </button>
          <button type="button" class="tool chip" id="tool-provider" title="Sağlayıcı ve model">
            <span class="chip-dot" id="chip-dot"></span>
            <span id="chip-label">API yok</span>
          </button>
          <span class="composer-grow"></span>
          <button type="submit" class="send" id="composer-send" title="Gönder" aria-label="Gönder">
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path d="M8 12.5V3.5M4.2 7.2L8 3.4l3.8 3.8" />
            </svg>
          </button>
        </div>
      </form>
    </aside>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
